<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morse Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Morse trainer</h1>
<p class="sub">Learn to hear and send Morse code a few characters at a time.</p>

<section id="setup" class="card">
  <label>Mode</label>
  <div class="seg" id="modeSeg"><button data-m="listen" class="on">Listen and type</button><button data-m="send">Send with a key</button></div>
  <label for="lvl">Characters</label>
  <select id="lvl"></select>
  <label for="wpm">Speed: <b id="wv">12</b> words per minute</label>
  <input type="range" id="wpm" min="5" max="30" value="12">
  <label for="tone">Pitch: <b id="tv">600</b> Hz</label>
  <input type="range" id="tone" min="400" max="900" step="10" value="600">
  <label class="chk" id="hintRow" hidden><input type="checkbox" id="hint" checked> Show the dots and dashes while sending</label>
  <button class="primary" id="go">Start a round of 20</button>
  <p class="note" id="howto"></p>
</section>

<section id="play" class="card" hidden>
  <div class="stats">
    <div><b id="sScore">0</b><span>Score</span></div>
    <div><b id="sStreak">0</b><span>Streak</span></div>
    <div><b id="sRound">0/20</b><span>Round</span></div>
    <div><b id="sAcc">–</b><span>Accuracy</span></div>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div class="stage">
    <div class="lamp" id="lamp"></div>
    <div class="big" id="big">?</div>
    <div class="pat" id="pat"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>
  <div id="listenUI">
    <div class="pad" id="pad"></div>
    <p class="row"><button id="replay">Hear it again (Space)</button></p>
  </div>
  <div id="sendUI" hidden>
    <div class="pat mine" id="mine"></div>
    <button class="key" id="key">Hold to key (or hold Space)</button>
  </div>
  <div id="end" class="end" hidden>
    <h2 id="endH"></h2>
    <p id="endP"></p>
    <button class="primary" id="again">Play again</button>
    <button id="back" style="width:100%;margin-top:8px">Change settings</button>
  </div>
  <p class="row"><button id="quit">Quit round</button></p>
</section>

<details class="card"><summary>Morse chart (tap a character to hear it)</summary><div class="chart" id="chart"></div></details>
</main>
<script src="script.js"></script>
</body>
</html>
